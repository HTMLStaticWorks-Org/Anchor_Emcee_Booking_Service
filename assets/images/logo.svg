<svg width="280" height="56" viewBox="0 0 280 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anchor &amp; Emcee Booking Service">
  <title>Anchor &amp; Emcee Booking Service</title>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CB88" />
      <stop offset="50%" stop-color="#D8B46A" />
      <stop offset="100%" stop-color="#B99145" />
    </linearGradient>
  </defs>
  <!-- Emblem Badge -->
  <rect x="2" y="4" width="48" height="48" rx="12" fill="rgba(216, 180, 106, 0.12)" stroke="url(#goldGrad)" stroke-width="1.5" />
  <!-- Vintage Stage Microphone Icon -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="21" y="12" width="10" height="16" rx="5" fill="rgba(216, 180, 106, 0.2)" />
    <line x1="21" y1="17" x2="31" y2="17" stroke-width="1.4" />
    <line x1="21" y1="21" x2="31" y2="21" stroke-width="1.4" />
    <path d="M16 22 A10 10 0 0 0 36 22" />
    <line x1="26" y1="32" x2="26" y2="41" />
    <line x1="19" y1="41" x2="33" y2="41" />
    <!-- Subtle Stage Sparkle -->
    <circle cx="38" cy="14" r="1.2" fill="#D8B46A" stroke="none" />
    <circle cx="14" cy="15" r="1" fill="#6845C5" stroke="none" />
  </g>
  <!-- Brand Typography -->
  <text x="62" y="27" font-family="'Playfair Display', Georgia, serif" font-size="18.5" font-weight="700" letter-spacing="0.8" fill="#FFFFFF">ANCHOR &amp; EMCEE</text>
  <text x="63" y="43" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.2" fill="#D8B46A">BOOKING SERVICE</text>
</svg>
